model_args:
  spatial_dims: 2
  in_channels: 3
  out_channels: 3
  num_res_blocks: [1, 2, 2, 2, 2]
  num_channels: [32, 64, 128, 256, 384]
  attention_levels: [False, False, True, True, True]
  norm_num_groups: 32
  resblock_updown: False
  num_head_channels: [32, 64, 128, 256, 384]
  transformer_num_layers: 3
  use_flash_attention: true
  with_conditioning: True
  cross_attention_dim: 1024  # Dim of SSL embeddings  
  ssl_dim: 1024
  ssl_cond: True
  conditioning_embedding_num_channels: [8]
  conditioning_embedding_in_channels: 5

general_args:
  # Toggle whether to build a ControlNet alongside the UNet
  mask_conditioning: true # For Mask Conditioning
  class_conditioning: true # For Class Conditioning

data_args:
  data_path: "/home/PanNuke/"
  task: "image" # "image" for pathology image generation


train_args:
  # Basic training hyperparameters
  num_epochs: 100
  batch_size: 8
  lr: 0.0001
  # Logging & checkpointing frequency
  print_every: 1
  val_freq: 5
  device: "cuda:0" 
  num_val_samples: 10
  checkpoint_dir: /home/image_checkpoints

solver_args: 
  # ODE/flow matching hyperparameters
  method: "euler"
  step_size: 0.1
  time_points: 10


